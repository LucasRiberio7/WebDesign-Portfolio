<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade DOM</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <h1>Atividade: Manipulação do DOM</h1>

  <section class="card">
    <h2>Texto e Estilo</h2>
    <p id="texto-alvo">Texto original.</p>
    <button id="btn-texto">Alterar Texto</button>
    <button id="btn-cor">Trocar Cor</button>
  </section>

  <section class="card">
    <h2>Lista de Tarefas</h2>
    <ul id="lista-tarefas">
      <li>Estudar DOM</li>
    </ul>
    <input type="text" id="input-tarefa" placeholder="Nova tarefa...">
    <button id="btn-adicionar">Adicionar</button>
  </section>

  <section class="card">
    <h2>Contador</h2>
    <p>Valor: <span id="contador">0</span></p>
    <button id="btn-incrementar">+1</button>
    <button id="btn-resetar">Resetar</button>
  </section>

  <script src="script/script.js"></script>
</body>
</html>
